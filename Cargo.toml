[workspace]
members = ["macula-rust-sdk-ffi"]

[package]
name = "macula-rust-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "Rust port of macula's SDK (client/leaf) wire protocol — mobile first, not mobile-only. See plans/PLAN_WIRE_PROTOCOL.md."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/macula-io/macula-rust-sdk"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
# cert_chain.rs: pure X.509 path validation (no hostname/SAN check, unlike
# rustls's own ServerCertVerifier machinery in cert.rs) to a caller-supplied
# realm CA — already transitively pulled in by rustls, declared directly
# here since cert_chain.rs uses its EndEntityCert::verify_for_usage API.
rustls-webpki = { version = "0.103", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7"] }
blake3 = "1.5"
# ucan.rs: JWT-shaped token (de)serialization, matching the reference
# macula_ucan_nif's own dependency choices exactly (its Cargo.toml has no
# UCAN-spec crate either, only these same generic primitives).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
tempfile = "3"
# Test-only: generates synthetic Ed25519 certs to unit-test
# PubkeyPinVerifier's matching logic without needing a live station that
# happens to present that cert type — see src/cert.rs's tests. Not a
# runtime dependency of the crate itself (see src/cert.rs's module doc:
# a dialing client never generates or presents a cert of its own).

# Test-only, cert_chain.rs's own tests: signed_by() needs a SubjectPublicKeyInfo
# constructed from a raw advertiser Ed25519 pubkey rather than a freshly
# rcgen-generated one (the leaf must bind the SAME key that signed the
# advertisement) — SubjectPublicKeyInfo::from_der needs this feature.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
# Test-only, cert_chain.rs's own tests: rcgen's CertificateParams
# not_before/not_after fields take this crate's OffsetDateTime directly;
# not re-exported by rcgen, so declared explicitly (already transitively
# present via rcgen itself).
time = "0.3"
