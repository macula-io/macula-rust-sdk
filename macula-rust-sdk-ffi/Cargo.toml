[package]
name = "macula-rust-sdk-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Macula <raf.lefever@erlef.org>"]
description = "UniFFI mobile (Kotlin/Swift) bindings for macula-rust-sdk. Wraps the core crate; adds nothing to it."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/macula-io/macula-rust-sdk"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[lib]
name = "macula_rust_sdk_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
macula-rust-sdk = { path = ".." }
uniffi = { version = "0.32", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
# tests/live_cert_chain_direct_dial.rs's self-issued realm CA/leaf fixture,
# mirroring ../tests/live_cert_chain.rs's own — versions matched to the
# core crate's own pins.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
time = "0.3"
base64 = "0.22"
